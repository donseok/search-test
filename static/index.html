<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MES 검색 실험실</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a href="/" class="brand"><span class="logo">M</span> MES <b>SEARCH LAB</b></a><span class="local"><i></i> LOCAL DATABASE</span></header>
<main><div class="eyebrow">COLD ROLLING · MES REBUILD</div><h1>다르게 입력해도,<br><em>같은 정보를 찾도록.</em></h1><p class="intro">띄어쓰기부터 영문 표현, 작은 오타까지.<br>냉연 공장 MES 데이터를 검색하고 결과를 비교해 보세요.</p>
<form id="search-form"><label class="sr" for="query">검색어</label><div class="searchbox"><span aria-hidden="true">⌕</span><input id="query" maxlength="100" placeholder="프로젝트, coil, RAL_9006…" autocomplete="off"><button type="submit">검색 <span>↗</span></button></div>
<div class="options"><label>검색 범위 <select id="category"><option value="">전체 업무</option><option>공통</option><option>생산</option><option>품질</option><option>설비</option><option>물류</option></select></label><label><input id="fuzzy" type="checkbox" checked> 오타 허용</label></div></form>
<div class="examples"><span>이렇게 검색해 보세요</span><div id="examples"></div></div>
<section class="workspace"><div class="result-head"><h2>검색 결과 <span id="count">0</span></h2><span id="timing"></span></div><div class="trace" id="trace"></div><div id="results" aria-live="polite"></div></section>
<footer><span>SQLite · 합성 MES 샘플 14건</span><span>실제 공장 데이터는 포함하지 않습니다.</span></footer></main><script src="/app.js"></script></body></html>
